<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Магазин — NIGHT CITY ARMORY</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <header class="header">
    <a class="brand" href="index.html">
      <img src="img/logo.svg" alt="Логотип Night City Armory">
      NIGHT CITY ARMORY
    </a>
    <nav class="menu">
      <a href="index.html">О проекте</a>
      <a href="shop.html" class="active">Магазин</a>
      <a href="contacts.html">Обратная связь</a>
      <button id="theme" class="button theme-button" type="button">Светлая тема</button>
    </nav>
  </header>

  <main class="main">
    <h1>Магазин</h1>
    <p>Каталог оружия. Цены указаны в евродолларах (€$).</p>

    <section id="products" class="cards"></section>
  </main>

  <div class="modal fade" id="orderModal" tabindex="-1" aria-labelledby="orderModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="orderModalTitle">Заказ</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
        </div>
        <div class="modal-body" id="orderModalBody"></div>
        <div class="modal-footer">
          <button type="button" class="button" data-bs-dismiss="modal">Закрыть</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>NIGHT CITY ARMORY — учебный проект. Не является настоящим магазином.</p>
  </footer>
</body>
</html>
