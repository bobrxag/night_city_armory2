<!doctype html>
<html lang="ru">
<head>

  <link rel="stylesheet" href="style.css">
</head>

  <header class="header">
    <a class="brand" href="index.html">
      <img src="img/logo.svg" alt="Логотип Night City Armory">

    <nav class="menu">

  <main class="main">
    <h1>Обратная связь</h1>
    <p>Напишите нам, если у вас есть вопрос.</p>

    <form class="form">
      <label for="name">Имя</label>
      <input type="text" id="name">

      <label for="email">Почта</label>
      <input type="text" id="email">

      <label for="message">Сообщение</label>
      <textarea id="message" rows="5"></textarea>

      <button class="button" type="button">Отправить</button>
    </form>

    <h2>Контакты</h2>
    <p>Почта: info@nightcityarmory.example</p>
    <p>Адрес: Найт-Сити, Уотсон, склад №7 (вымышленный).</p>
  </main>

  <footer class="footer">
    <p>NIGHT CITY ARMORY — учебный проект. Не является настоящим магазином.</p>
  </footer>
