<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Обратная связь — NIGHT CITY ARMORY</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <header class="header">
    <a class="brand" href="index.html">
      <img src="img/logo.svg" alt="Логотип Night City Armory">
      NIGHT CITY ARMORY
    </a>
    <nav class="menu">
      <a href="index.html">О проекте</a>
      <a href="shop.html">Магазин</a>
      <a href="contacts.html" class="active">Обратная связь</a>
      <button id="theme" class="button theme-button" type="button">Светлая тема</button>
    </nav>
  </header>

  <main class="main">
    <h1>Обратная связь</h1>
    <p>Напишите нам, если у вас есть вопрос.</p>

    <form id="contactForm" class="form">
      <label for="name">Имя</label>
      <input type="text" id="name" placeholder="Ваше имя">

      <label for="email">Почта</label>
      <input type="text" id="email" placeholder="name@example.com">

      <label for="message">Сообщение</label>
      <textarea id="message" rows="5"></textarea>

      <button class="button" type="submit">Отправить</button>
    </form>
    <p id="formMessage"></p>

    <h2>Контакты</h2>
    <p>Почта: artemsviridov567@gmail.com</p>
    <p>Адрес: Найт-Сити, Уотсон, склад №7 (вымышленный).</p>
  </main>

  <footer class="footer">
    <p>NIGHT CITY ARMORY — учебный проект. Не является настоящим магазином.</p>
  </footer>
</body>
</html>
